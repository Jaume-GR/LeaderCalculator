services:
 proxy:
  build: ./proxy
  container_name: proxy
  restart: on-failure
  environment:
    ZK_HOSTS: "nodo1:2181,
               nodo2:2181,
               nodo3:2181,
               nodo4:2181,
               nodo5:2181"
  ports:
    - "5000:5000"
  networks:
    - zk-net

 nodo1:
  build: .
  container_name: nodo1
  hostname: nodo1
  restart: on-failure
  environment:
    ZOO_MY_ID: 1
    ZOO_SERVERS: "server.1=nodo1:2888:3888;2181
                  server.2=nodo2:2888:3888;2181
                  server.3=nodo3:2888:3888;2181
                  server.4=nodo4:2888:3888;2181
                  server.5=nodo5:2888:3888;2181"
  ports:
    - "2181:2181"
    - "5001:5000"
  volumes:
    - ./data/nodo1:/data
  networks:
    - zk-net
  
 nodo2:
